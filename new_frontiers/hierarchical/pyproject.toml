[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-universe"
version = "0.1.0"
description = "First-principles geometric and categorical framework for quantum, atomic, and molecular modeling"
readme = "readme/context.md"
requires-python = ">=3.9"
dependencies = [
    "mpmath>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[project.optional-dependencies]
tui = [
    "textual>=0.70.0",
]

